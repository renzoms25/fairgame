name: Build downloads

# Pushing a tag like v0.7.0 builds Windows, Mac and Linux versions and attaches them to a
# GitHub Release.  "Run workflow" on the Actions tab builds them without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install pipenv
          python -m pipenv install --dev
      - name: Test
        run: python -m pipenv run pytest tests
      - name: Build
        run: python -m pipenv run python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: FairGame-${{ matrix.os }}
          path: dist/*.zip

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: zips/*.zip
